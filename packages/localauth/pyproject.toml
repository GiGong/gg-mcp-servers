[project]
name = "localauth"
version = "0.1.0"
description = "Passphrase-gated OAuth 2.1 authorization server for FastMCP, with no external IdP"
requires-python = ">=3.11"
dependencies = ["fastmcp>=3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localauth"]

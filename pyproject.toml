[project]
name = "gg-mcp-servers"
version = "0.1.0"
description = "A collection of self-hosted remote MCP servers"
requires-python = ">=3.11"
dependencies = ["localauth", "gg-mcp-stocks", "gg-mcp-lostark"]

[tool.uv.workspace]
members = ["packages/*", "servers/*"]

[tool.uv.sources]
localauth = { workspace = true }
gg-mcp-stocks = { workspace = true }
gg-mcp-lostark = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

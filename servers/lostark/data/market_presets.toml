# Saved market searches for market_prices(preset="...").
#
# Category codes come from GET /markets/options (checked 2026-10-13). A preset
# is only a search; it holds no prices or game numbers. Add your own freely.
#
#   category  name or code from the market catalog (required)
#   query     substring of the item name
#   tier      item tier
#   grade     item grade

[presets."융화재료"]
description = "All fusion materials (오레하, 아비도스, 상급 아비도스)"

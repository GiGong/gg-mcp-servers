[project]
name = "kis-mcp"
version = "0.1.0"
description = "Read-only MCP server over the Korea Investment & Securities (KIS) Open API"
requires-python = ">=3.11"
dependencies = [
    "localauth",
    "fastmcp>=3.4",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[project.scripts]
kis-mcp = "kis_mcp.__main__:main"

[tool.uv.sources]
localauth = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kis_mcp"]
